name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            style
            ci
            perf
            build
            revert
          requireScope: false
          # Accepts the breaking-change bang both before and after the scope
          # (feat!(scope): ... and feat(scope)!: ...) — index.js's own regex
          # only implements the former, but the latter is the Conventional
          # Commits spec's documented form, so both are allowed here.
          headerPattern: '^(\w+)(?:!)?(?:\(([^)]+)\))?(?:!)?:\s?(.+)$'
          headerPatternCorrespondence: type, scope, subject
          wip: true
