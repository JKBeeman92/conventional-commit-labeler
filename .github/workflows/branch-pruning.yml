name: Branch Pruning

on:
  schedule:
    - cron: '17 3 * * *' # daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/prune-branches.js');
            await run({ github, context, core });
