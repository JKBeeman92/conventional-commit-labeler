name: 'PR Conventional Commit Labeler'
description: 'Automatically labels PRs based on their conventional commit title. Supports multi-label, stale-label removal, and auto-creating missing labels.'
author: 'JKBeeman92'
branding:
  icon: 'git-commit'
  color: 'green'
inputs:
  token:
    description: 'The GITHUB_TOKEN secret'
    required: true
  label_map:
    description: |
      Optional JSON object that overrides or extends the built-in default label map.
      The defaults already cover all standard conventional commit types:
        feat, fix, docs, chore, refactor, test, style, ci, perf, build, revert
      Pass only the keys you want to change — the rest of the defaults remain active.
      Examples:
        Override one label:   '{"feat": "Enhancement"}'
        Add a custom type:    '{"security": "Security Fix"}'
        Full replacement:     '{"feat": "Feature", "fix": "Bugfix"}' (only these two active)
    required: false
    default: '{}'
runs:
  using: 'node20'
  main: 'dist/index.js'
